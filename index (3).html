<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cafeat8 Market Test v3</title>
<script src="https://unpkg.com/@zxing/browser@latest"></script>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f4f1ea;color:#1f2a20}
.wrap{max-width:720px;margin:auto;padding:18px}.card{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 10px rgba(0,0,0,.08)}
input{font-size:26px;width:100%;box-sizing:border-box;padding:13px;border:1px solid #bbb;border-radius:12px}
button{font-size:20px;font-weight:700;border:0;border-radius:13px;padding:14px 16px;margin:7px 4px 7px 0;background:#204e32;color:white}
.secondary{background:#ddd;color:#222}.reward{background:#9a6b13}.big{font-size:30px;font-weight:800}.muted{color:#666}.row{display:flex;gap:8px;flex-wrap:wrap}
.item{padding:10px 0;border-bottom:1px solid #eee}video{width:100%;border-radius:14px;background:#111;max-height:440px}.ok{background:#e8f6ea;padding:10px;border-radius:10px}.warn{background:#fff3cd;padding:10px;border-radius:10px}
</style>
</head>
<body>
<div class="wrap">
<h1>☕ Cafeat8 Market Test v3</h1>

<div class="card">
<label>Customer number</label>
<input id="customer" inputmode="numeric" placeholder="e.g. 00824">
<div class="row">
<button onclick="openCustomer()">Open customer</button>
<button class="secondary" onclick="newCustomer()">New customer</button>
</div>
<div id="custStatus" class="muted">No customer selected</div>
</div>

<div class="card">
<div class="big">Fidelity: <span id="loyalty">0</span>/10</div>
<div id="rewardStatus" class="muted">No free bag available</div>
</div>

<div class="card">
<div class="row">
<button onclick="startScanner()">📷 Start QR scanner</button>
<button class="secondary" onclick="stopScanner()">Stop camera</button>
</div>
<video id="video" playsinline muted></video>
<div id="scanStatus" class="muted">Ready to scan a Cafeat8 coffee QR.</div>
</div>

<div class="card">
<h2>Current purchase</h2>
<div id="purchaseList" class="muted">No bags scanned</div>
<div class="row">
<button onclick="finishSale()">Finish paid sale</button>
<button class="reward" onclick="redeemReward()">Free bag / reward</button>
<button class="secondary" onclick="clearPurchase()">Clear</button>
</div>
</div>

<div class="card">
<h2>Customer history</h2>
<div id="history" class="muted">Select a customer</div>
</div>
</div>

<script>
let currentCustomer=null,purchase=[],controls=null,lastText="",lastTime=0;
const key=id=>"cafeat8_customer_"+id;
const getData=id=>JSON.parse(localStorage.getItem(key(id))||'{"paid":0,"freeUsed":0,"products":{},"history":[]}');
const saveData=(id,d)=>localStorage.setItem(key(id),JSON.stringify(d));

function openCustomer(){const id=document.getElementById('customer').value.trim();if(!id)return alert("Enter customer number");currentCustomer=id;render();}
function newCustomer(){const id=document.getElementById('customer').value.trim();if(!id)return alert("Enter a new customer number");if(!localStorage.getItem(key(id)))saveData(id,getData(id));currentCustomer=id;render();}

function render(){
 if(!currentCustomer)return;
 const d=getData(currentCustomer),progress=d.paid%10,available=Math.floor(d.paid/10)-d.freeUsed;
 document.getElementById('custStatus').innerHTML=`<b>Customer ${currentCustomer}</b> · ${d.paid} paid bags total`;
 document.getElementById('loyalty').textContent=progress;
 document.getElementById('rewardStatus').innerHTML=available>0?`<div class="ok">🎁 ${available} free bag(s) available</div>`:"No free bag available";
 const entries=Object.entries(d.products);
 document.getElementById('history').innerHTML=entries.length?entries.map(([p,n])=>`<div class="item">${p}: <b>${n}</b> bags</div>`).join('')+`<div class="item">Free bags used: <b>${d.freeUsed}</b></div>`:"No purchases yet";
 renderPurchase();
}

function productFromText(t){
 t=(t||"").trim();
 let m=t.match(/PRODUCT=([^|]+)/i)||t.match(/P=([^|]+)/i);
 if(m)return m[1].trim().toUpperCase();
 const map={"/3-brazil-medium-1/":"BRAZIL","/14-peru/":"PERU","/21-mexico/":"MEXICO","/6-sumatra/":"SUMATRA","/18-medium-espresso-coffee/":"ESPRESSO OF THE DAY","/12-robusta-coffee/":"ROBUSTA","/5-ethiopia-sidamo/":"ETHIOPIA SIDAMO","/10-decaffeinated-coffee/":"DECAFFEINATED"};
 for(const [part,name] of Object.entries(map))if(t.includes(part))return name;
 return null;
}

function acceptScan(text){
 const now=Date.now();if(text===lastText&&now-lastTime<1800)return;lastText=text;lastTime=now;
 const product=productFromText(text);
 if(!product){document.getElementById('scanStatus').innerHTML=`<div class="warn">QR read, but product not recognized:<br>${text}</div>`;return;}
 purchase.push(product);document.getElementById('scanStatus').innerHTML=`<div class="ok">✓ ${product} added</div>`;renderPurchase();
}

function renderPurchase(){
 const el=document.getElementById('purchaseList');if(!purchase.length){el.innerHTML="No bags scanned";return;}
 const counts={};purchase.forEach(p=>counts[p]=(counts[p]||0)+1);
 el.innerHTML=Object.entries(counts).map(([p,n])=>`<div class="item">${p}: <b>${n}</b></div>`).join('')+`<div class="item">Total: <b>${purchase.length}</b> bag(s)</div>`;
}

async function startScanner(){
 if(controls)return;
 try{
   const reader=new ZXingBrowser.BrowserQRCodeReader();
   controls=await reader.decodeFromConstraints({video:{facingMode:{ideal:"environment"}}},document.getElementById('video'),(result)=>{if(result)acceptScan(result.getText());});
   document.getElementById('scanStatus').textContent="Scanner active — point the camera at the QR code.";
 }catch(e){
   document.getElementById('scanStatus').innerHTML='<div class="warn">Camera could not start. Open this page in Safari and allow Camera access.</div>';
   controls=null;
 }
}

function stopScanner(){if(controls){controls.stop();controls=null;}const v=document.getElementById('video');if(v.srcObject){v.srcObject.getTracks().forEach(t=>t.stop());v.srcObject=null;}}
function finishSale(){if(!currentCustomer)return alert("Open a customer first");if(!purchase.length)return alert("Scan at least one coffee bag");const d=getData(currentCustomer);d.paid+=purchase.length;purchase.forEach(p=>d.products[p]=(d.products[p]||0)+1);d.history.push({date:new Date().toISOString(),type:"paid",products:[...purchase]});saveData(currentCustomer,d);purchase=[];render();}
function redeemReward(){if(!currentCustomer)return alert("Open a customer first");if(purchase.length!==1)return alert("For a reward, scan exactly 1 coffee bag.");const d=getData(currentCustomer),available=Math.floor(d.paid/10)-d.freeUsed;if(available<1)return alert("This customer has no free bag available.");d.freeUsed++;d.history.push({date:new Date().toISOString(),type:"free",products:[...purchase]});saveData(currentCustomer,d);purchase=[];render();}
function clearPurchase(){purchase=[];renderPurchase();}
</script>
</body>
</html>
